# ---------------------------------------------------------------------------
# Bicep infrastructure — what-if on PR, apply on tag.
# ---------------------------------------------------------------------------
name: infrastructure

on:
  pull_request:
    branches: [master]
    paths:
      - 'infra/**'
      - '.github/workflows/infrastructure.yml'
  push:
    tags:
      - 'infra-v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]
      mode:
        description: 'what-if or apply'
        required: true
        default: 'what-if'
        type: choice
        options: [what-if, apply]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  bicep:
    name: Bicep · ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve env file
        id: env
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          echo "envFile=infra/env/${ENV}.bicepparam" >> "$GITHUB_OUTPUT"
          echo "envName=${ENV}" >> "$GITHUB_OUTPUT"

      - name: az bicep build (validate syntax)
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      # The .bicepparam files read these with no default, so an unset repository secret would reach the
      # deployment as an empty administrator password rather than as a failure. Fail here instead, and
      # never echo a value.
      - name: Assert deployment secrets are configured
        env:
          FRESHCART_SQL_ADMIN_PASSWORD: ${{ secrets.FRESHCART_SQL_ADMIN_PASSWORD }}
          FRESHCART_PG_ADMIN_PASSWORD: ${{ secrets.FRESHCART_PG_ADMIN_PASSWORD }}
          FRESHCART_MYSQL_ADMIN_PASSWORD: ${{ secrets.FRESHCART_MYSQL_ADMIN_PASSWORD }}
          FRESHCART_KV_ADMIN_OBJECT_ID: ${{ secrets.FRESHCART_KV_ADMIN_OBJECT_ID }}
        run: |
          missing=0
          required="FRESHCART_SQL_ADMIN_PASSWORD FRESHCART_PG_ADMIN_PASSWORD FRESHCART_MYSQL_ADMIN_PASSWORD FRESHCART_KV_ADMIN_OBJECT_ID"
          for name in ${required}; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not configured as a repository secret."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "Refusing to deploy: administrator credentials must come from secrets, not from a parameter-file default."
            exit 1
          fi

      - name: az deployment sub what-if
        if: ${{ github.event.inputs.mode != 'apply' }}
        env:
          FRESHCART_SQL_ADMIN_LOGIN: ${{ secrets.FRESHCART_SQL_ADMIN_LOGIN }}
          FRESHCART_SQL_ADMIN_PASSWORD: ${{ secrets.FRESHCART_SQL_ADMIN_PASSWORD }}
          FRESHCART_PG_ADMIN_LOGIN: ${{ secrets.FRESHCART_PG_ADMIN_LOGIN }}
          FRESHCART_PG_ADMIN_PASSWORD: ${{ secrets.FRESHCART_PG_ADMIN_PASSWORD }}
          FRESHCART_MYSQL_ADMIN_LOGIN: ${{ secrets.FRESHCART_MYSQL_ADMIN_LOGIN }}
          FRESHCART_MYSQL_ADMIN_PASSWORD: ${{ secrets.FRESHCART_MYSQL_ADMIN_PASSWORD }}
          FRESHCART_KV_ADMIN_OBJECT_ID: ${{ secrets.FRESHCART_KV_ADMIN_OBJECT_ID }}
        run: |
          az deployment sub what-if \
            --location eastus \
            --template-file infra/main.bicep \
            --parameters @${{ steps.env.outputs.envFile }} \
            --result-format FullResourcePayloads

      - name: az deployment sub create (apply)
        if: ${{ github.event.inputs.mode == 'apply' || startsWith(github.ref, 'refs/tags/infra-v') }}
        env:
          FRESHCART_SQL_ADMIN_LOGIN: ${{ secrets.FRESHCART_SQL_ADMIN_LOGIN }}
          FRESHCART_SQL_ADMIN_PASSWORD: ${{ secrets.FRESHCART_SQL_ADMIN_PASSWORD }}
          FRESHCART_PG_ADMIN_LOGIN: ${{ secrets.FRESHCART_PG_ADMIN_LOGIN }}
          FRESHCART_PG_ADMIN_PASSWORD: ${{ secrets.FRESHCART_PG_ADMIN_PASSWORD }}
          FRESHCART_MYSQL_ADMIN_LOGIN: ${{ secrets.FRESHCART_MYSQL_ADMIN_LOGIN }}
          FRESHCART_MYSQL_ADMIN_PASSWORD: ${{ secrets.FRESHCART_MYSQL_ADMIN_PASSWORD }}
          FRESHCART_KV_ADMIN_OBJECT_ID: ${{ secrets.FRESHCART_KV_ADMIN_OBJECT_ID }}
        run: |
          az deployment sub create \
            --location eastus \
            --name freshcart-${{ steps.env.outputs.envName }}-${{ github.run_id }} \
            --template-file infra/main.bicep \
            --parameters @${{ steps.env.outputs.envFile }}
