# NOTE: This file is a placeholder. In real environments secrets are mounted into the pod via
# the Azure Key Vault CSI driver (see secretproviderclass.yaml). Never check real values in.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secret
  namespace: freshcart
type: Opaque
stringData:
  ConnectionStrings__cache: 'freshcart-dev-redis.redis.cache.windows.net:6380,ssl=True,abortConnect=False'
  # The key ring is the material behind the session cookie, so it lives on a Redis instance only the
  # gateway and Identity can reach - never the cache instance shared with Basket/Catalog/Support/Notify.
  ConnectionStrings__dataprotection: 'freshcart-dpkeys-dev-redis.redis.cache.windows.net:6380,ssl=True,abortConnect=False'
  Jwt__SigningKey: 'replace-from-keyvault-this-is-a-placeholder-32+chars'
