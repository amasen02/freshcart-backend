apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: freshcart
data:
  ASPNETCORE_ENVIRONMENT: 'Production'
  ASPNETCORE_HTTP_PORTS: '8080'
  OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector.observability.svc.cluster.local:4317'
  OTEL_SERVICE_NAME: 'freshcart-gateway'
  Cors__AllowedOrigins__0: 'https://www.freshcart.local'
  Jwt__Issuer: 'https://identity.freshcart.local'
  Jwt__Audience: 'https://freshcart.local'
  # Only the in-cluster ingress controller may set X-Forwarded-For. Leaving this unset makes the gateway
  # ignore the header entirely; widening it would let a caller pick its own rate-limit partition key.
  ForwardedHeaders__KnownNetworks__0: '10.0.0.0/8'
